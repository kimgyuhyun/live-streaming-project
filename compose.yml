# 로컬 개발용. 서버에서는 compose.prod.yml을 겹쳐 쓴다.
# 모든 컨테이너에 mem_limit·cpus를 건다 (server-infra 규칙). 값은 인프라 검증 단계에서 실측으로 조정한다.
name: live-streaming

# 이미지 이름을 지정하지 않는다. 두 서비스가 같은 이름으로 동시에 빌드하면 충돌한다(두 번째 빌드는 캐시로 끝난다).
x-api: &api
  build: ./backend
  environment:
    DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
    DB_USERNAME: ${DB_USERNAME:?.env에 DB_USERNAME이 필요합니다}
    DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
    REDIS_HOST: redis
    # 비어 있으면 운영자 계정을 만들지 않는다
    OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
    OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
    # 스튜디오 OBS 안내의 송출 서버 주소
    APP_OBS_SERVER: ${APP_OBS_SERVER:-rtmp://localhost/live}
    # 재발급 때 송출 연결을 끊는 MediaMTX API. 내부망에서만 열린다(mediamtx에 9997 포트를 열지 않는다)
    MEDIAMTX_API_URL: http://mediamtx:9997
    # MediaMTX API를 부를 때 싣는 내부 비밀번호. MediaMTX가 API 호출마다 키 확인 엔드포인트로 되물어 Spring이 맞춰 본다.
    # 같은 내부망의 다른 컨테이너는 이 값을 모르므로 API를 부를 수 없다(#26). mediamtx에는 넣지 않는다
    MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?.env에 MEDIAMTX_API_PASSWORD가 필요합니다}
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
  # MediaMTX가 키 확인을 보낼 내부 이름. api-1·api-2가 같은 이름을 나눠 가져 한 대가 죽어도 다른 대가 받는다(PRD channel)
  networks:
    default:
      aliases:
        - api
  depends_on:
    oracle:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped

services:
  oracle:
    image: gvenzl/oracle-free:23.26.4-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?.env에 ORACLE_PASSWORD가 필요합니다}
      APP_USER: ${DB_USERNAME}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata
    ports:
      - "127.0.0.1:1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  api-1: *api
  api-2: *api

  mediamtx:
    # 훅(runOnAvailable·runOnUnavailable)이 셸과 wget을 쓴다. 기본 이미지에는 둘 다 없다(PRD channel C2)
    image: bluenviron/mediamtx:1.21.4-ffmpeg
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8888:8888"
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  # 데모 방송 시뮬레이터(#14, PRD channel C3). 평소 up에는 뜨지 않는다:
  #   node --env-file=.env demo/setup.mjs  →  docker compose --profile demo up -d demo
  # ffmpeg·sh가 들어 있는 MediaMTX 이미지를 그대로 쓴다. 송출은 다시 인코딩하지 않는다(-c copy)
  demo:
    image: bluenviron/mediamtx:1.21.4-ffmpeg
    profiles: [demo]
    entrypoint: ["/bin/sh", "/demo/simulator.sh"]
    volumes:
      # streams.txt(키)를 읽고, video.mp4가 없으면 여기에 만든다. 둘 다 git 제외
      - ./demo:/demo
    depends_on:
      - mediamtx
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    image: live-streaming-nginx:local
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - api-1
      - api-2
      - mediamtx
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped

volumes:
  oracle-data:
