spring:
  application:
    name: live-streaming
  # IDE에서 실행할 때 루트의 .env를 읽는다. 컨테이너에서는 compose가 환경변수로 넣는다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  # 세션은 Redis에. 회원별 색인을 함께 저장해 비밀번호 변경 때 그 회원의 세션을 찾는다(PRD member M2)
  session:
    redis:
      repository-type: indexed
    timeout: 7d   # 마지막 요청 후 7일

server:
  # nginx가 넘긴 X-Forwarded-For를 Tomcat이 실제 사용자 IP로 쓴다. 내부 프록시 대역에서 온 것만 믿는다
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  # 상태를 바꾸는 요청을 받아 줄 출처(Origin). 로컬은 nginx(:8080)와 Vite 개발 서버(:5173)
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  # 둘 다 있으면 앱 시작 때 운영자 계정을 만든다. 그 이메일의 계정이 이미 있으면 그대로 둔다(PRD member M4)
  operator:
    email: ${OPERATOR_EMAIL:}
    password: ${OPERATOR_PASSWORD:}
  # 스튜디오 OBS 안내의 "서버" 값(PRD channel 송출 주소). 서버 배포 때 실제 주소로 바꾼다
  obs-server: ${APP_OBS_SERVER:rtmp://localhost/live}
  # MediaMTX API(재발급 때 송출 연결 끊기). 도커 내부망에서만 열린다(PRD channel). compose는 http://mediamtx:9997
  mediamtx:
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}

# nginx가 /api/ 만 Spring으로 넘기므로 actuator도 그 아래에 둔다. 기본 노출은 health 하나뿐이다.
management:
  endpoints:
    web:
      base-path: /api/actuator
  endpoint:
    health:
      show-components: always
