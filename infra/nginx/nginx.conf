# 이 프로젝트의 입구. 서버에서는 server-infra의 edge-caddy 뒤에서 평문 HTTP로 받는다.
# TLS·80/443·인증서는 Caddy가 맡는다.

server_tokens off;

# 어느 Spring 인스턴스가 응답했는지 남긴다(부하 분산 확인용).
log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time';

# 실제 사용자 IP: edge 대역(server-infra가 고정한 10.250.0.0/24)에서 온 X-Forwarded-For만 믿는다.
set_real_ip_from 10.250.0.0/24;
real_ip_header X-Forwarded-For;

# Spring 컨테이너가 재시작해 IP가 바뀌어도 nginx를 다시 띄우지 않도록 도커 DNS를 주기적으로 다시 조회한다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api-1:8080 resolve;
    server api-2:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log upstream;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Spring의 내부 엔드포인트(MediaMTX 키 확인 등)는 인증 없이 받는다. 바깥에는 열지 않는다(PRD channel).
    # 이 블록이 없으면 location / 의 try_files가 200 + index.html을 준다
    location /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # LL-HLS는 서버가 다음 조각이 나올 때까지 playlist 응답을 잡아 둔다. 버퍼링하면 지연이 늘어난다.
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        # MediaMTX는 첫 요청을 쿠키 확인용으로 /live/...?cookieCheck=1 로 리다이렉트한다. /hls 접두사를 붙여 돌려준다.
        # 컨테이너 안의 포트(80)가 붙은 절대 주소가 되지 않도록 상대 경로로 둔다.
        proxy_redirect / /hls/;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
