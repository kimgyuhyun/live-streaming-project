# 이 프로젝트의 입구. 서버에서는 server-infra의 edge-caddy 뒤에서 평문 HTTP로 받는다.
# TLS·80/443·인증서는 Caddy가 맡는다.

server_tokens off;

# 어느 Spring 인스턴스가 응답했는지 남긴다(부하 분산 확인용).
log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time';

# 실제 사용자 IP: edge 대역(server-infra가 고정한 10.250.0.0/24)에서 온 X-Forwarded-For만 믿는다.
set_real_ip_from 10.250.0.0/24;
real_ip_header X-Forwarded-For;

# 공개 API의 IP당 요청 수 제한(#31). 위 real_ip를 거친 주소(edge가 넘긴 실제 사용자 IP)로 센다.
# 초당 10건: 시청자 한 명은 채널당 5초에 한 번(#12)이라 한 IP(NAT) 뒤 50명이 모두 폴링해도 넘지 않는다.
# 버스트 40은 /api/ location마다 정한다. 10MB 영역은 IP 약 16만 개를 담는다
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_status 429;

# Spring 컨테이너가 재시작해 IP가 바뀌어도 nginx를 다시 띄우지 않도록 도커 DNS를 주기적으로 다시 조회한다.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api-1:8080 resolve;
    server api-2:8080 resolve;
}

# 채널 조회 1초 캐시(#29). 방송 중 채널의 시청자가 5초마다 다시 묻는 요청(#12)을 Spring·DB까지 보내지 않는다.
# 키 수 = 채널 수라 1MB 영역(약 8천 키)이면 충분하다
proxy_cache_path /var/cache/nginx/channel levels=1:2 keys_zone=channel:1m max_size=10m inactive=10s use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log upstream;

    root /usr/share/nginx/html;

    # 요청 수 제한(#31)이 낸 429를 다른 API 오류와 같은 모양({"code","message"})으로 준다. 프론트가 message를 그대로 보인다.
    # nginx가 직접 낸 429만 바뀐다. Spring이 보낸 429(로그인 시도 제한 MEMBER_LOGIN_BLOCKED)는
    # proxy_intercept_errors가 꺼져 있어 그대로 간다
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type "application/json; charset=utf-8";
        return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요"}';
    }

    location / {
        try_files $uri /index.html;
    }

    # Spring의 내부 엔드포인트(MediaMTX 키 확인 등)는 인증 없이 받는다. 바깥에는 열지 않는다(PRD channel).
    # 이 블록이 없으면 location / 의 try_files가 200 + index.html을 준다
    location /internal/ {
        return 404;
    }

    location /api/ {
        # 페이지를 처음 열 때 몰리는 요청은 기다리게 하지 않고 바로 보낸다(nodelay)
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 공개 채널 조회만 담는다. 정규식 location이 접두사 /api/보다 먼저 맞고, 다른 하위 경로는 /api/로 간다.
    # 쓰기(PUT)는 proxy_cache_methods 기본값(GET·HEAD) 밖이라 매번 Spring으로 간다.
    # 앞자리 0(/api/channels/021)은 담지 않는다. Spring은 같은 채널 21로 읽지만 캐시 키는 따로라, 변형을 바꿔 가며 보내면
    # 캐시 영역을 채워 진짜 채널 항목을 밀어낸다. 이 요청은 /api/로 가 그대로 Spring이 답한다(우회 자체는 #31 요청 수 제한)
    location ~ ^/api/channels/[1-9][0-9]*$ {
        # /api/와 같은 영역으로 센다. 제한은 캐시를 보기 전에 돌아 캐시 HIT도 센다(없는 채널 id는 캐시되지 않고 Spring까지 간다)
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_cache channel;
        # query는 키에서 뺀다. ?x=랜덤을 붙여 캐시를 지나쳐 DB를 두드릴 수 없다
        proxy_cache_key $uri;
        # 200만 담는다. nginx의 캐시 시각은 초 단위라 실제로는 1~2초 남는다
        proxy_cache_valid 200 1s;
        # 빈 캐시나 막 만료된 채널에 몰린 요청 중 하나만 Spring에 보내고, 나머지는 기다리거나 직전 값으로 답한다
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        # Spring Security가 모든 응답에 no-store를 붙인다. nginx만 무시하고 브라우저에는 그대로 보낸다
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    # LL-HLS는 서버가 다음 조각이 나올 때까지 playlist 응답을 잡아 둔다. 버퍼링하면 지연이 늘어난다.
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        # MediaMTX는 첫 요청을 쿠키 확인용으로 /live/...?cookieCheck=1 로 리다이렉트한다. /hls 접두사를 붙여 돌려준다.
        # 컨테이너 안의 포트(80)가 붙은 절대 주소가 되지 않도록 상대 경로로 둔다.
        proxy_redirect / /hls/;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        # 시청 세션의 주소를 진짜 시청자 주소로(#40). $remote_addr는 위 real_ip가 고친 주소다.
        # 시청자가 보낸 X-Forwarded-For는 이어 붙이지 않고 덮어쓴다 — 주소를 꾸며 IP당 세션 한도를 피하지 못하게
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
