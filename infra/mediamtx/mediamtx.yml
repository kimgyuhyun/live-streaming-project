# 여기에 없는 항목은 MediaMTX 기본값을 쓴다.
# 설정 근거와 실측값은 docs/spikes/infra-validation.md 1절.

logLevel: info

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
# nginx가 넘긴 X-Forwarded-For를 시청 세션의 주소(remoteAddr)로 쓴다. 믿는 곳은 nginx가 있는 도커 대역뿐이다
# (compose.yml의 networks.default에 고정). 시청자 수를 IP당 5세션까지만 세는 데 쓴다(#40, PRD viewer V1)
hlsTrustedProxies: ['172.27.0.0/16']

# 쓰지 않는 프로토콜은 끈다.
rtsp: no
webrtc: no
srt: no
# 1.21부터 MoQ 서버가 기본으로 켜진다(:8892 TCP·UDP, :8893 UDP). 쓰지 않는다(스파이크 1절 7번)
moq: no
metrics: no

# 재발급 때 Spring이 송출 연결을 끊고, 1분마다 송출 중인 경로를 대조하는 데 쓴다. compose에서 포트를 열지 않는다 —
# 연결 목록 응답의 query에 스트림 키가 그대로 있다(PRD channel).
# 내부망에서도 Spring만 부를 수 있다: API 호출도 아래 키 확인(authMethod: http)을 거치고,
# Spring은 자기가 싣는 내부 비밀번호(MEDIAMTX_API_PASSWORD, Basic 인증)만 허용한다(#26)
api: yes
apiAddress: :9997

# 송출 시작·API 호출 때 Spring에 묻는다. 2xx면 허용, 그 밖(응답 없음 포함)은 거부.
# api는 compose의 네트워크 별칭(api-1·api-2). Spring은 publish(스트림 키)와 api(내부 비밀번호)만 판단하므로
# 나머지 action은 인증에서 뺀다(1.21 기본값은 빈 목록이라 시청까지 Spring으로 간다).
authMethod: http
authHTTPAddress: http://api:8080/internal/mediamtx/auth
authHTTPExclude:
  - action: read
  - action: metrics
  - action: pprof
  - action: playback

pathDefaults:
  # 같은 채널의 두 번째 송출을 거부한다. 기본값 true면 나중 송출이 기존 송출을 밀어낸다(PRD channel)
  overridePublisher: false
  # 방송 시작·종료를 Spring에 알린다(PRD channel C2). 실패해도 다시 보내지 않는다 — Spring이 1분마다 API로 대조한다.
  # MTX_PATH는 live/21 꼴. MTX_QUERY에는 스트림 키가 있으므로 싣지 않는다. Spring은 live/{채널ID}가 아니면 무시한다
  runOnAvailable: 'wget -q -O /dev/null -T 5 --post-data "" "http://api:8080/internal/mediamtx/available?path=$MTX_PATH"'
  runOnUnavailable: 'wget -q -O /dev/null -T 5 --post-data "" "http://api:8080/internal/mediamtx/unavailable?path=$MTX_PATH"'

paths:
  all_others:
