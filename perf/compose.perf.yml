# 요청 수 제한 측정 전용(#31). compose.yml에 겹쳐 쓴다.
#   docker compose -f compose.yml -f perf/compose.perf.yml up -d nginx
#   docker compose -f compose.yml -f perf/compose.perf.yml run --rm k6 run ... /perf/rate-limit.js
# nginx는 edge 대역(10.250.0.0/24)에서 온 X-Forwarded-For만 믿는다. 호스트에서 k6로 보내면 모든 요청이 한 IP라
# 정상 시청자까지 한도에 걸린다. 그래서 서버의 edge-caddy 자리에 k6를 두고 X-Forwarded-For로 사용자 IP를 나눈다.
# 측정이 끝나면 nginx를 이 파일 없이 다시 띄우고 망을 지운다(같은 대역을 쓰는 NginxRateLimitTest와 겹치지 않게)
networks:
  perf-edge:
    ipam:
      config:
        - subnet: 10.250.0.0/24

services:
  nginx:
    networks:
      - default
      - perf-edge

  k6:
    image: grafana/k6:2.1.0
    profiles: [perf]
    networks:
      - perf-edge
    volumes:
      - ./perf:/perf:ro
      - ./docs/perf:/out
